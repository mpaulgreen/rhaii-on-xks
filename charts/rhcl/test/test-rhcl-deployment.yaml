---
# RHCL Test Deployment Manifest
#
# Prerequisites:
# 1. RHCL deployed via helmfile (charts/rhcl/helmfile.yaml.gotmpl)
# 2. Istio installed with Gateway API support
# 3. Red Hat pull secret available in kuadrant-system namespace
#
# To deploy:
#   kubectl apply -f test-rhcl-deployment.yaml
#
# To cleanup:
#   kubectl delete -f test-rhcl-deployment.yaml
#   OR
#   kubectl delete ns rhcl-test
#
---
# Test namespace
# Note: Istio sidecar injection is disabled because the cluster uses OpenShift Service Mesh images
# which are incompatible with vanilla Kubernetes/AKS (missing iptables-save binary).
# RHCL policies enforce at the Gateway level, so backend sidecars are not required for testing.
apiVersion: v1
kind: Namespace
metadata:
  name: rhcl-test
  labels:
    # istio-injection: enabled  # Disabled due to OpenShift Service Mesh image incompatibility on AKS

---
# NOTE: Pull secrets are NOT included in this manifest
# They will be copied from kuadrant-system namespace by the deploy-test.sh script:
# - redhat-pull-secret (for pod images)
# - wasm-plugin-pull-secret (for WasmPlugin image - hardcoded requirement by Kuadrant operator)
#
# Both secrets are created by the RHCL Helm chart in kuadrant-system namespace.
# Manual copy commands if needed:
#   kubectl get secret redhat-pull-secret -n kuadrant-system -o yaml | \
#     sed 's/namespace: kuadrant-system/namespace: rhcl-test/' | \
#     kubectl apply -f -
#   kubectl get secret wasm-plugin-pull-secret -n kuadrant-system -o yaml | \
#     sed 's/namespace: kuadrant-system/namespace: rhcl-test/' | \
#     kubectl apply -f -

---
# NOTE: Service aliases (kuadrant-auth-service, kuadrant-ratelimit-service) are NOT required.
# The Kuadrant operator automatically creates EnvoyFilters that add these services as Envoy clusters.

---
# ServiceAccount for echo service with imagePullSecrets
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: rhcl-test
imagePullSecrets:
- name: redhat-pull-secret

---
# ServiceAccount for Istio Gateway pods
# Pre-creating with imagePullSecrets to avoid ImagePullBackOff
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rhcl-test-gateway-istio
  namespace: rhcl-test
  labels:
    app: rhcl-test-gateway
imagePullSecrets:
- name: redhat-pull-secret

---
# Simple echo service for testing
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: rhcl-test
spec:
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: echo

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: rhcl-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      serviceAccountName: default
      containers:
      - name: echo
        image: ealen/echo-server:0.9.2
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi

---
# Gateway for test traffic
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: rhcl-test-gateway
  namespace: rhcl-test
spec:
  gatewayClassName: istio
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same

---
# HTTPRoute to echo service
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo-route
  namespace: rhcl-test
spec:
  parentRefs:
  - name: rhcl-test-gateway
  hostnames:
  - "echo.test.local"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: echo
      port: 8080

---
# AuthPolicy - Anonymous auth with explicit authorization
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: echo-auth
  namespace: rhcl-test
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: echo-route
  rules:
    authentication:
      "anonymous-access":
        anonymous: {}
    authorization:
      "allow-all":
        opa:
          rego: |
            allow = true
    response:
      success:
        headers:
          "x-auth-service":
            plain:
              value: authorino

---
# RateLimitPolicy - 10 requests per minute
apiVersion: kuadrant.io/v1
kind: RateLimitPolicy
metadata:
  name: echo-ratelimit
  namespace: rhcl-test
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: echo-route
  limits:
    "per-minute":
      rates:
      - limit: 10
        window: 1m

---
# Istio AuthorizationPolicy - Allow all traffic
# WARNING: TEST ONLY - This allows ALL traffic and should NEVER be used in production
# This prevents Istio's RBAC from blocking requests before RHCL policies can enforce
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-all
  namespace: rhcl-test
  labels:
    environment: test
    security-review: allow-all-policy
spec:
  selector:
    matchLabels:
      app: echo
  action: ALLOW
  rules:
  - {}
