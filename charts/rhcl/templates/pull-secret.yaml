{{- if .Values.images.pullSecret.create }}
{{- if .Values.images.pullSecret.dockerConfigJson }}
# Pull secret for operator namespace
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.images.pullSecret.name }}
  namespace: {{ .Values.namespaces.operators }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ .Values.images.pullSecret.dockerConfigJson | b64enc }}

---
# Pull secret for instance namespace (for Authorino/Limitador components)
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.images.pullSecret.name }}
  namespace: {{ .Values.namespaces.instances }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ .Values.images.pullSecret.dockerConfigJson | b64enc }}

---
# WasmPlugin pull secret (hardcoded name required by Kuadrant operator)
# This secret is required for WasmPlugin to pull the WASM shim image
# Users must copy this secret to namespaces where they deploy policies
apiVersion: v1
kind: Secret
metadata:
  name: wasm-plugin-pull-secret
  namespace: {{ .Values.namespaces.instances }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ .Values.images.pullSecret.dockerConfigJson | b64enc }}
{{- end }}
{{- end }}
