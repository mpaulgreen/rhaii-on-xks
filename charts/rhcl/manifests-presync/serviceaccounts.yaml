# Pre-create ServiceAccounts with imagePullSecrets before Helm install
# These will be adopted by the operator deployments when they are created

apiVersion: v1
kind: ServiceAccount
metadata:
  name: kuadrant-operator-controller-manager
  namespace: kuadrant-operators
  labels:
    app: kuadrant
    app.kubernetes.io/name: kuadrant-operator
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: rhcl
    app.kubernetes.io/managed-by: rhaii-on-xks
imagePullSecrets:
  - name: redhat-pull-secret

