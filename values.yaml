# rhaii-on-xks configuration

# =============================================================================
# Pull Secret Configuration
# =============================================================================
# Option 1: Use system podman auth (recommended)
#   Requires: ~/.config/containers/auth.json
#   Setup: cp ~/pull-secret.txt ~/.config/containers/auth.json
useSystemPodmanAuth: true

# Option 2: Use pull secret file directly (set useSystemPodmanAuth: false)
pullSecretFile: ""  # e.g., ~/pull-secret.txt

# =============================================================================
# Operators
# =============================================================================

# cert-manager operator (required for TLS)
certManager:
  enabled: true

# sail-operator / Istio (required for gateway)
sailOperator:
  enabled: true

# lws-operator (optional - for multi-node workloads)
lwsOperator:
  enabled: true

# rhcl (Red Hat Connectivity Link) - optional API gateway, auth, rate limiting
rhclOperator:
  enabled: true  # Enabled by default - set to false if not needed (optional component)
  # RHCL-specific configuration (passed to charts/rhcl/values.yaml)
  # NOTE: This setting overrides charts/rhcl/values.yaml operators.dns.enabled when using helmfile
  operators:
    dns:
      # DNS operator deployment control
      # - Set to true here AND in charts/rhcl/values.yaml for full deployment
      # - This root setting takes precedence when deploying via make deploy-all
      # - Requires Azure/AWS/GCP DNS credentials for full functionality
      # - Basic operator validation works without credentials (pods will start)
      enabled: false

# =============================================================================
# KServe
# =============================================================================

# KServe OCI chart version (dev variant until official builds are on registry.redhat.io)
kserveChartVersion: "3.4.0-ea.1-dev-8a30e66"
