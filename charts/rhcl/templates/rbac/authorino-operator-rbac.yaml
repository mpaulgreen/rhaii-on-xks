{{- if and .Values.rbac.create .Values.operators.authorino.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: authorino-operator-manager-role
  labels:
    app.kubernetes.io/name: authorino-operator
    app.kubernetes.io/part-of: rhcl
rules:
# Core resources
- apiGroups: [""]
  resources: ["events", "configmaps", "secrets", "services", "serviceaccounts"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups: [""]
  resources: ["configmaps/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]
# Apps
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments/status"]
  verbs: ["get", "patch", "update"]
# Coordination for leader election
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
# Authorino CRDs
- apiGroups: ["authorino.kuadrant.io"]
  resources: ["authconfigs"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups: ["authorino.kuadrant.io"]
  resources: ["authconfigs/status"]
  verbs: ["get", "patch", "update"]
- apiGroups: ["operator.authorino.kuadrant.io"]
  resources: ["authorinos"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups: ["operator.authorino.kuadrant.io"]
  resources: ["authorinos/status", "authorinos/finalizers"]
  verbs: ["get", "patch", "update"]
# RBAC - Authorino operator creates Roles/RoleBindings
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
# Authentication/Authorization
- apiGroups: ["authentication.k8s.io"]
  resources: ["tokenreviews"]
  verbs: ["create"]
- apiGroups: ["authorization.k8s.io"]
  resources: ["subjectaccessreviews"]
  verbs: ["create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: authorino-operator-manager-rolebinding
  labels:
    app.kubernetes.io/name: authorino-operator
    app.kubernetes.io/part-of: rhcl
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: authorino-operator-manager-role
subjects:
- kind: ServiceAccount
  name: authorino-operator
  namespace: {{ .Values.namespaces.operators }}
{{- end }}
