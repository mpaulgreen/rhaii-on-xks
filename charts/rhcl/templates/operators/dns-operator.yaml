{{- if .Values.operators.dns.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-operator-controller-manager
  namespace: {{ .Values.namespaces.operators }}
  labels:
    control-plane: dns-operator-controller-manager
    app.kubernetes.io/name: dns-operator
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: rhcl
spec:
  replicas: {{ .Values.operators.dns.replicas }}
  selector:
    matchLabels:
      control-plane: dns-operator-controller-manager
  template:
    metadata:
      labels:
        control-plane: dns-operator-controller-manager
        app.kubernetes.io/name: dns-operator
        app.kubernetes.io/component: operator
        app.kubernetes.io/part-of: rhcl
    spec:
      serviceAccountName: dns-operator-controller-manager
      {{- with .Values.operators.dns.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operators.dns.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operators.dns.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        {{- if .Values.operators.dns.podSecurityContext }}
        {{- toYaml .Values.operators.dns.podSecurityContext | nindent 8 }}
        {{- else }}
        seccompProfile:
          type: RuntimeDefault
        {{- end }}
      containers:
      - name: manager
        image: {{ .Values.images.registry }}/{{ .Values.images.operators.dns.repository }}@{{ .Values.images.operators.dns.digest }}
        imagePullPolicy: {{ .Values.images.pullPolicy }}
        command:
        - /manager
        args:
        - --metrics-bind-address=:8080
        - --leader-elect
        env:
        - name: WATCH_NAMESPACES
          value: ""
        - name: CLUSTER_SECRET_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        {{- with .Values.operators.dns.env }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        ports:
        - name: metrics
          containerPort: 8080
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 3
        resources:
          {{- toYaml .Values.operators.dns.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
{{- end }}
