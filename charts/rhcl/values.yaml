# Default values for Red Hat Connectivity Link (RHCL) Helm Chart

# Platform configuration
platform:
  type: kubernetes  # Options: kubernetes, openshift

# Namespaces
namespaces:
  operators: kuadrant-operators  # Where operator deployments run
  instances: kuadrant-system     # Where Kuadrant instance and components run

# Image registry and pull secrets
images:
  registry: registry.redhat.io
  pullPolicy: IfNotPresent

  pullSecret:
    name: redhat-pull-secret
    create: true
    # dockerConfigJson is injected by helmfile from auth.json
    # Can be overridden with --set-file or --set
    dockerConfigJson: ""

  # Operator images (with digest pinning for reproducibility)
  operators:
    kuadrant:
      repository: rhcl-1/rhcl-rhel9-operator
      # Image from RHCL 1.2.1
      digest: sha256:1afb2fe0fe38bb0ef02c4b8cb9edb83f7847da47f8ddad766223664dc05ce272

    authorino:
      repository: rhcl-1/authorino-rhel9-operator
      # Image from Authorino Operator 1.2.4
      digest: sha256:0b60bb9afa31a549d0eac9331f6024e461ab3aed5b1fb2d461dd4db8ddeebeb9

    limitador:
      repository: rhcl-1/limitador-rhel9-operator
      # Image from Limitador Operator 1.2.0
      digest: sha256:6092c510b04a4cee253a52c07b77b625e90d863fa9ccd8727eb901bd81b4e071

    dns:
      repository: rhcl-1/dns-rhel9-operator
      # Image from DNS Operator 1.2.0
      digest: sha256:61e8a471cf20273fe879031eb302a1c7179b5423db4f0a8b9dccefae753ffdf4

  # Component images (deployed by operators via RELATED_IMAGE env vars)
  components:
    authorino:
      repository: rhcl-1/authorino-rhel9
      digest: sha256:be77901b29529646bbec6baf0d1a7c350be0db291b07a845f353181c25d89f78

    limitador:
      repository: rhcl-1/limitador-rhel9
      digest: sha256:aff28d76f9cfeefafd6b652e055bb25e1a2bf250e062e3e9b5e54db873f9eeb7

    wasmshim:
      # Note: Different registry for WASM shim
      repository: rhcl-1/wasm-shim-rhel9
      digest: sha256:aa524e9278976aa3ef0f2d3aeb981e28d2ea6ed6fc5fede05a5dd33db0bb3de2
      registry: registry.access.redhat.com  # Override for this component

# Operator configurations
# Optimized for AKS with GPU nodes
operators:
  kuadrant:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    # Additional environment variables (optional)
    env: []
    # Pod security context (optional, defaults to seccompProfile: RuntimeDefault)
    podSecurityContext: {}
    # Avoid scheduling on GPU nodes (AKS-specific)
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: sku
              operator: NotIn
              values: ["gpu"]

  authorino:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    env: []
    podSecurityContext: {}
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: sku
              operator: NotIn
              values: ["gpu"]

  limitador:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    env: []
    podSecurityContext: {}
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: sku
              operator: NotIn
              values: ["gpu"]

  dns:
    enabled: true  # Disabled by default - requires Azure/AWS/GCP DNS credentials
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    env: []
    podSecurityContext: {}
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: sku
              operator: NotIn
              values: ["gpu"]

# RHCL instance configuration
instance:
  kuadrant:
    enabled: true
    name: kuadrant
    # Kuadrant CR spec
    # The Kuadrant operator will create Authorino and Limitador instances based on this
    spec: {}

# RBAC configuration
rbac:
  create: true
  # Create granular CRD-specific roles (admin/edit/view per CRD)
  # Set to false to only create operator ClusterRoles
  createGranularRoles: false

  # List of CRDs for which to create granular roles
  # Only used if createGranularRoles is true
  crds:
    # Kuadrant CRDs
    - name: kuadrants.kuadrant.io
    - name: authpolicies.kuadrant.io
    - name: ratelimitpolicies.kuadrant.io
    - name: dnspolicies.kuadrant.io
    - name: tlspolicies.kuadrant.io
    - name: tokenratelimitpolicies.kuadrant.io
    - name: oidcpolicies.extensions.kuadrant.io
    - name: planpolicies.extensions.kuadrant.io
    - name: telemetrypolicies.extensions.kuadrant.io
    # Authorino CRDs
    - name: authconfigs.authorino.kuadrant.io
    - name: authorinos.operator.authorino.kuadrant.io
    # Limitador CRDs
    - name: limitadors.limitador.kuadrant.io
    # DNS CRDs
    - name: dnsrecords.kuadrant.io
    - name: dnshealthcheckprobes.kuadrant.io

# Prerequisites validation
prerequisites:
  # Validate cert-manager is installed
  # Version must match cert-manager-operator chart (appVersion: 1.15.2)
  certManager:
    enabled: true
    version: ">=1.15.2"

  # Validate Gateway API CRDs are installed
  # Version must match sail-operator chart (gatewayAPI.version: v1.4.0)
  gatewayAPI:
    enabled: true
    version: ">=1.4.0"

# Optional: User-provided policies to create after Kuadrant is ready
# These are examples - typically users will create policies separately
policies:
  enabled: false

  # AuthPolicies to create
  authPolicies: []

  # RateLimitPolicies to create
  rateLimitPolicies: []

  # DNSPolicies to create
  dnsPolicies: []

  # TLSPolicies to create
  tlsPolicies: []

# Helmfile configuration (used by helmfile.yaml.gotmpl)
# Uses podman auth from ~/.config/containers/auth.json
useSystemPodmanAuth: true
pullSecretFile: ""
authFile: ""
